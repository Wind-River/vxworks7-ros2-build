# This is an action for the VxWorks ROS 2 build.
# It downloads the WRLabs SDK and unpack it
#

name: 'Setup WRSDK'
description: 'Download and setup the VxWorks SDK'

inputs:
  sdks_list:
    description: 'JSON file that provides a description of all supported SDKs'
    required: false
    default: 'wrsdks.json'
  sdk:
    description: 'SDK Name'
    required: false
    default: 'qemu'
  vxworks:
    description: 'VxWorks Release'
    required: false
    default: '24.03'
  directory:
    description: 'Directory to download and extract the SDK'
    required: false
    default: '/tmp'
  sdkenv:
    description: 'Source SDK environment'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # sdkenv.sh refuses to run with /bin/sh = dash (Ubuntu's default): use bash,
    # as the build containers do (Docker/*/vxbuild: dpkg-reconfigure dash)
    - name: Use bash as /bin/sh (required by sdkenv.sh)
      run: |
        echo "dash dash/sh boolean false" | sudo debconf-set-selections
        sudo DEBIAN_FRONTEND=noninteractive dpkg-reconfigure dash
        ls -l /bin/sh
      shell: bash

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jsonschema
      shell: bash

    - name: Calculate SDK URL
      id: calculate-url
      run: |
        mkdir -p ${{ inputs.directory }}
        cd $GITHUB_ACTION_PATH
        python ./parse_wrsdks.py ${{ inputs.sdks_list }} ${{ inputs.sdk }} ${{ inputs.vxworks }} > ${{ inputs.directory }}/sdk-url.txt
        cd ${{ inputs.directory }}
        echo SDK_URL=$(cat sdk-url.txt) >> $GITHUB_ENV
        echo FILENAME=$(basename $(cat sdk-url.txt)) >> $GITHUB_ENV
        # One tarball path for every caller, whatever 'directory' is: the cache
        # entry is matched on key AND path, so a per-directory path made each
        # caller (build: /tmp, toolkit-selftest: /tmp/vanilla) miss and re-download.
        echo SDK_TARBALL=/tmp/wrsdk-dl/$(basename $(cat sdk-url.txt)) >> $GITHUB_ENV
      shell: bash

    - name: Cache SDK tarball
      id: cache-sdk-tarball
      uses: actions/cache@v4
      with:
        path: ${{ env.SDK_TARBALL }}
        key: ${{ runner.os }}-sdk-tarball-${{ env.FILENAME }}

    - name: Download SDK
      if: steps.cache-sdk-tarball.outputs.cache-hit != 'true'
      run: |
        mkdir -p $(dirname ${{ env.SDK_TARBALL }})
        wget --no-check-certificate ${{ env.SDK_URL }} -O ${{ env.SDK_TARBALL }}
      shell: bash

    - name: Cache extracted SDK
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: ${{ inputs.directory }}/wrsdk
        key: ${{ runner.os }}-wrsdk-${{ env.FILENAME }}-${{ inputs.sdk }}

    - name: Extract SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${{ inputs.directory }}/wrsdk
        cd  ${{ inputs.directory }}/wrsdk
        tar xvfj ${{ env.SDK_TARBALL }} --strip 1
      shell: bash

    - name: Source SDK environment
      if: ${{ inputs.sdkenv == 'true' }}
      run: |
        . ${{ inputs.directory }}/wrsdk/sdkenv.sh
        echo "WIND_SDK_HOME=$WIND_SDK_HOME" >> $GITHUB_ENV
        echo "WIND_SDK_CCBASE_PATH=$WIND_SDK_CCBASE_PATH" >> $GITHUB_ENV
        echo "WIND_SDK_CC_SYSROOT=$WIND_SDK_CC_SYSROOT" >> $GITHUB_ENV
        echo "WIND_CC_SYSROOT=$WIND_SDK_CC_SYSROOT" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> $GITHUB_ENV  
      shell: bash
