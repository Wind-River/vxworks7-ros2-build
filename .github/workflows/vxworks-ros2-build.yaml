# This is a workflow for the VxWorks ROS 2 build.
# It builds a ROS 2 VxWorks port against the VxWorks SDK 

name: 'VxWorks ROS 2 build'
run-name: Build ${{ inputs.ros_distro }} ${{ inputs.vxworks }} ${{ inputs.sdk }}

on:
  workflow_call:
    inputs:
      ros_distro:
        required: true
        type: string
        default: lyrical
      vxworks:
        required: true
        type: string
        default: "26.03"
      sdk:
        required: true
        type: string
        default: qemu
      test:
        required: false
        type: boolean
        default: false
      toolkit:
        required: false
        type: boolean
        default: false
      debug:
        required: false
        type: boolean
        default: false
  
  workflow_dispatch:
    inputs:
      ros_distro:
        description: "ROS 2 Distribution"
        required: true
        default: lyrical
      vxworks:
        description: "VxWorks Release"
        required: true
        default: "26.03"
      sdk:
        description: "SDK Name"
        required: true
        default: qemu
      test:
        description: "run tests"
        required: false
        default: false
        type: boolean
      toolkit:
        description: "toolkit"
        required: false
        default: false
        type: boolean
      debug:
        description: "Debug"
        required: false
        default: false
        type: boolean

jobs:
  # The build container, built once per run (docker-build.yaml) and uploaded as
  # the artifact "Docker Image vxros2build <ros_distro>"; the jobs that run in it
  # (build, toolkit-selftest) download and docker-load it.
  docker:
    uses: ./.github/workflows/docker-build.yaml
    with:
      ros_distro: ${{ inputs.ros_distro }}

  build:
    runs-on: ubuntu-24.04
    needs: docker
    outputs:
      sdk: ${{ steps.set_outputs.outputs.sdk }}
      ros_distro: ${{ steps.set_outputs.outputs.ros_distro }}
    env:
      ros_distro: ${{ inputs.ros_distro }}
      vxworks:   ${{ inputs.vxworks }}
      sdk:       ${{ inputs.sdk }}

    steps:
      - name: Checks-out a branch ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Free up disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          # Remove large preinstalled toolchains the VxWorks ROS 2 build does not need.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/graalvm || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"; df -h /

      - name: Use Download SDK action
        uses: ./.github/actions/setup-wrsdk
        with:
          sdks_list: wrsdks.json
          sdk: ${{ env.sdk }}
          vxworks: ${{ env.vxworks }}
          directory: /tmp
          sdkenv: false

      - name: Download the vxros2build container
        uses: actions/download-artifact@v4
        with:
          name: Docker Image vxros2build ${{ env.ros_distro }}
          path: /tmp/docker-image

      - name: Load the vxros2build container
        run: |
          docker load -i /tmp/docker-image/vxros2build.${{ env.ros_distro }}.tar.gz
          rm -rf /tmp/docker-image
          docker images vxros2build:${{ env.ros_distro }}

      - name: Restore ccache (ROS 2 C/C++ compile cache)
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          # key on SDK + distro; restore-keys warm-starts from the latest prior
          # cache even when the exact key changes (ccache self-validates hits).
          key: ccache-${{ env.sdk }}-${{ env.ros_distro }}-${{ env.vxworks }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.sdk }}-${{ env.ros_distro }}-${{ env.vxworks }}-
            ccache-${{ env.sdk }}-${{ env.ros_distro }}-

      - name: Build ROS 2 ${{ env.ros_distro }} against VxWorks ${{ env.vxworks }} ${{ env.sdk }}
        run:  |
          # chmod 777 so the in-container build user (wruser, remapped to the
          # passed -e UID by the entrypoint) can write the bind-mounted cache dir.
          mkdir -p /tmp/ccache
          chmod 777 /tmp/ccache
          docker run --rm \
            -e UID=$(id -u) -e GID=$(id -g) \
            -e CCACHE_DIR=/ccache -e CCACHE_COMPILERCHECK=content -e CCACHE_MAXSIZE=5G \
            -v /tmp/ccache:/ccache \
            -v /tmp/wrsdk:/wrsdk \
            -v ${{ github.workspace }}:/work \
            vxros2build:${{ env.ros_distro }} \
            /bin/bash -c 'set -- /wrsdk/sdkenv.sh; . /wrsdk/sdkenv.sh && make fs sdk-overlay -C /work'

      - name: Create an SROS2 script
        run: |
          cat << 'EOF' > /tmp/sros2_script.sh
          #!/bin/bash
          set -x
          . /opt/ros/${{ env.ros_distro }}/setup.sh
          ros2 security create_keystore demo_keystore
          ros2 security create_enclave demo_keystore /talker_listener/talker
          ros2 security create_enclave demo_keystore /talker_listener/listener
          EOF
          chmod +x /tmp/sros2_script.sh

      - name: Generate a keystore, keys, and certificates for the talker and listener nodes
        run:  |
          docker run --rm \
            -w /tmp \
            -e UID=$(id -u) -e GID=$(id -g) \
            -v /tmp/sros2_script.sh:/tmp/sros2_script.sh \
            -v ${{ github.workspace }}:/work \
            vxros2build:${{ env.ros_distro }} \
            /bin/bash -c 'cd /tmp && /tmp/sros2_script.sh && mv /tmp/demo_keystore /work/output/export/deploy/.'

      - name: Create an HDD image
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools
          cd ${{ github.workspace }}
          # Build the image at the Makefile's canonical location (output/ros2.img,
          # = $(TOP_BUILDDIR)/ros2.img) so downstream consumers (make toolkit /
          # make-toolkit.sh) find it where they expect.
          dd if=/dev/zero of=output/ros2.img count=2048 bs=1M
          mkfs.vfat -F 32 ./output/ros2.img
          mkdir -p /tmp/mount
          sudo mount -o loop -t vfat ./output/ros2.img /tmp/mount
          sudo cp -r -L ./output/export/deploy/* /tmp/mount/.
          df -h /tmp/mount/
          sudo umount /tmp/mount

      - name: Copy VxWorks image
        run: |
          # Kernel image(s): x86 -> vxWorks; rpi4b -> uVxWorks (+ vxWorks).
          cp /tmp/wrsdk/vxsdk/bsps/*/*xWorks* ${{ github.workspace }}
          # rpi4b also needs the device tree; QEMU boots it with -dtb and the
          # test harness (find_dtb) looks for rpi-4b.dtb next to the kernel.
          cp /tmp/wrsdk/vxsdk/bsps/*/*.dtb ${{ github.workspace }} 2>/dev/null || true

      - name: Upload VxWorks and the HDD image
        uses: actions/upload-artifact@v4
        with:
          name: HDD image ${{ env.sdk }} ${{ env.ros_distro }}
          path: |
            ${{ github.workspace }}/output/ros2.img
            ${{ github.workspace }}/*xWorks*
            ${{ github.workspace }}/*.dtb

      - name: Pack the ROS 2 SDK (export/root)
        run: |
          # tar, because upload-artifact does not keep symlinks (.so chains).
          cd ${{ github.workspace }}/output
          tar --zstd -cf ros2-sdk.tar.zst export/root
          ls -l ros2-sdk.tar.zst

      - name: Upload the ROS 2 SDK (export/root)
        uses: actions/upload-artifact@v4
        with:
          name: ROS 2 SDK ${{ env.sdk }} ${{ env.ros_distro }}
          path: ${{ github.workspace }}/output/ros2-sdk.tar.zst

      - name: Upload the SDK overlay
        uses: actions/upload-artifact@v4
        with:
          name: SDK overlay ${{ env.sdk }} ${{ env.ros_distro }}
          # make sdk-overlay's archive (files/ + sdk_overlay.json + install-sdk-overlay.sh)
          path: ${{ github.workspace }}/output/sdk-overlay-*.tar.*

      - name: Setup upterm session
        if: ${{ always() && inputs.debug }}
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true

      - name: Set outputs for sdk and ros_distro
        id: set_outputs
        run: |
          echo "sdk=${{ env.sdk }}" >> $GITHUB_OUTPUT
          echo "ros_distro=${{ env.ros_distro }}" >> $GITHUB_OUTPUT

  toolkit:
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ inputs.toolkit }}
    env:
      ROS_DISTRO: ${{ needs.build.outputs.ros_distro }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # No SDK here: make toolkit reads no SDK files, and the SDK identity
      # (release id, arch, SDK name) comes from the SDK overlay's sdk_overlay.json.
      - name: Download the HDD image
        uses: actions/download-artifact@v4
        with:
          name: HDD image ${{ needs.build.outputs.sdk }} ${{ needs.build.outputs.ros_distro }}

      - name: Download the ROS 2 SDK (export/root)
        uses: actions/download-artifact@v4
        with:
          name: ROS 2 SDK ${{ needs.build.outputs.sdk }} ${{ needs.build.outputs.ros_distro }}
          path: ${{ github.workspace }}/output

      - name: Download the SDK overlay
        uses: actions/download-artifact@v4
        with:
          name: SDK overlay ${{ needs.build.outputs.sdk }} ${{ needs.build.outputs.ros_distro }}
          path: ${{ github.workspace }}/output

      - name: Assemble the ROS 2 SDK toolkit
        run: |
          cd ${{ github.workspace }}/output
          tar --zstd -xf ros2-sdk.tar.zst && rm ros2-sdk.tar.zst
          mkdir -p sdk-overlay-build
          # make-sdk-overlay.sh writes .tar.zst, or .tar.gz without zstd: let tar detect it
          tar -C sdk-overlay-build -xf sdk-overlay-*.tar.*
          ls -ld export/root sdk-overlay-build/sdk-overlay-* ros2.img
          cd ${{ github.workspace }} && make toolkit

      - name: Upload the ROS 2 SDK toolkit
        uses: actions/upload-artifact@v4
        with:
          name: ros2-vxworks-toolkit ${{ needs.build.outputs.sdk }} ${{ needs.build.outputs.ros_distro }}
          path: ${{ github.workspace }}/output/toolkit-*.tar.*

  test:
    # raspberrypi4b: boot the aarch64 target on an arm64 host; x86 SDKs on amd64
    runs-on: ${{ needs.build.outputs.sdk == 'raspberrypi4b' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: build
    if: ${{ inputs.test }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Use SDK and ROS Distro from build job
        run: |
          echo "SDK: ${{ needs.build.outputs.sdk }}"
          echo "ROS Distro: ${{ needs.build.outputs.ros_distro }}"

      - name: Download HDD image and VxWorks artifacts
        uses: actions/download-artifact@v4
        with:
          name: HDD image ${{ needs.build.outputs.sdk }} ${{ needs.build.outputs.ros_distro }}

      - name: Set up the QEMU test host
        uses: ./.github/actions/setup-qemu

      - name: Run Tests with QEMU and expect
        env:
          SDK: ${{ needs.build.outputs.sdk }}
        run: |
          # Change directory to GitHub workspace
          cd ${{ github.workspace }}

          # Select the harness target from the built SDK: raspberrypi4b -> rpi4
          # (aarch64; kernel uVxWorks + rpi-4b.dtb staged beside it), else x86.
          [ "$SDK" = "raspberrypi4b" ] && export VX_TARGET=rpi4

          # Run tests. The HDD-image artifact preserves its build-job path, so the
          # downloaded image is at ./output/ros2.img (the Makefile canonical
          # location); pass it explicitly to main_script.exp (default ./ros2.img).
          echo "Running tests..."
          ./tests/main_script.exp output/ros2.img ros2

  # The toolkit self-test, split by host: the samples are built with the SDK's
  # host tools (vxsdk/host/x86_64-linux), so on x86; they are run on QEMU on the
  # runner that matches the target (aarch64 raspi4b on arm64, like the test job).
  toolkit-selftest:
    runs-on: ubuntu-24.04
    needs: [build, toolkit]
    if: ${{ inputs.test && inputs.toolkit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download the ROS 2 SDK toolkit
        uses: actions/download-artifact@v4
        with:
          name: ros2-vxworks-toolkit ${{ needs.build.outputs.sdk }} ${{ needs.build.outputs.ros_distro }}
          path: ${{ github.workspace }}/toolkit-dl

      - name: Get a vanilla VxWorks SDK for the toolkit self-test
        uses: ./.github/actions/setup-wrsdk
        with:
          sdks_list: wrsdks.json
          sdk: ${{ needs.build.outputs.sdk }}
          vxworks: ${{ inputs.vxworks }}
          # Own directory: the action's "extracted SDK" cache is keyed by tarball
          # name only, and the build job saves /tmp/wrsdk AFTER pkg/sdk patched it.
          # A separate path gets a separate cache entry, i.e. a fresh extraction.
          directory: /tmp/vanilla
          sdkenv: false

      - name: Download the vxros2build container
        uses: actions/download-artifact@v4
        with:
          name: Docker Image vxros2build ${{ needs.build.outputs.ros_distro }}
          path: /tmp/docker-image

      - name: Load the vxros2build container
        run: |
          docker load -i /tmp/docker-image/vxros2build.${{ needs.build.outputs.ros_distro }}.tar.gz
          rm -rf /tmp/docker-image
          docker images vxros2build:${{ needs.build.outputs.ros_distro }}

      - name: Toolkit self-test — build the C++/Rust/Python samples from the toolkit
        run: |
          # A vanilla SDK + the toolkit, built in the vxros2build container like the
          # main build. The toolkit is unpacked here on the host (tar detects the
          # compression) and passed as a directory; selftest-build.sh applies it to
          # the SDK (ros2sdk-prepare.sh), builds one node per language and stages
          # install/ on a USB dir (-> /bd0a on target). The workspace and the SDK
          # are mounted at their host paths, so the absolute paths it writes to
          # selftest.env are valid on the host for the next step.
          cd ${{ github.workspace }}
          TGZ="$(ls toolkit-dl/toolkit-*.tar.* | head -1)"
          [ -f "$TGZ" ] || { echo "no toolkit tarball in toolkit-dl/"; exit 1; }
          mkdir -p toolkit-dl/unpacked && tar -C toolkit-dl/unpacked -xf "$TGZ"
          TK="$(find toolkit-dl/unpacked -mindepth 1 -maxdepth 1 -type d | head -1)"
          [ -d "$TK" ] || { echo "no top-level dir in $TGZ"; exit 1; }
          SDK=/tmp/vanilla/wrsdk
          docker run --rm \
            -e UID=$(id -u) -e GID=$(id -g) \
            -v $SDK:$SDK \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            vxros2build:${{ needs.build.outputs.ros_distro }} \
            /bin/bash -c "set -- $SDK/sdkenv.sh; . $SDK/sdkenv.sh && cd ${{ github.workspace }} && ./toolkit/scripts/selftest-build.sh --toolkit $PWD/$TK --sdk $SDK --workdir ${{ github.workspace }}/selftest"
          echo "--- selftest.env ---"; cat selftest/selftest.env

      - name: Pack the USB stage and the toolkit image
        run: |
          # tar, because upload-artifact does not keep symlinks (.so chains)
          cd ${{ github.workspace }}/selftest
          . ./selftest.env
          printf 'VX_TESTS="%s"\n' "$VX_TESTS" > tests.env
          cp "$VX_IMG" ros2.img
          tar --zstd -cf ../toolkit-selftest.tar.zst usb ros2.img tests.env
          ls -l ../toolkit-selftest.tar.zst

      - name: Upload the USB stage and the toolkit image
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-selftest ${{ needs.build.outputs.sdk }} ${{ needs.build.outputs.ros_distro }}
          path: ${{ github.workspace }}/toolkit-selftest.tar.zst

  toolkit-test:
    # same host choice as the test job
    runs-on: ${{ needs.build.outputs.sdk == 'raspberrypi4b' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: [build, toolkit-selftest]
    if: ${{ inputs.test && inputs.toolkit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # the VxWorks kernel the tests boot ships with the HDD image artifact
      - name: Download HDD image and VxWorks artifacts
        uses: actions/download-artifact@v4
        with:
          name: HDD image ${{ needs.build.outputs.sdk }} ${{ needs.build.outputs.ros_distro }}

      - name: Download the USB stage and the toolkit image
        uses: actions/download-artifact@v4
        with:
          name: toolkit-selftest ${{ needs.build.outputs.sdk }} ${{ needs.build.outputs.ros_distro }}
          path: ${{ github.workspace }}

      - name: Set up the QEMU test host
        uses: ./.github/actions/setup-qemu

      - name: Toolkit self-test — run on QEMU (USB -> /bd0a; image untouched)
        env:
          SDK: ${{ needs.build.outputs.sdk }}
        run: |
          cd ${{ github.workspace }}
          [ "$SDK" = "raspberrypi4b" ] && export VX_TARGET=rpi4
          mkdir -p selftest && tar --zstd -C selftest -xf toolkit-selftest.tar.zst
          . selftest/tests.env      # VX_TESTS: toolkit/test*-<lang>-*
          echo "VX_USB=$PWD/selftest/usb  image=$PWD/selftest/ros2.img  TESTS=$VX_TESTS"
          VX_USB="$PWD/selftest/usb" ./tests/main_script.exp "$PWD/selftest/ros2.img" $VX_TESTS
