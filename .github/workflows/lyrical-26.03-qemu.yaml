name: "Lyrical 26.03 QEMU Build"

on:
  schedule:
    - cron: '0 4 * * 0'  # every Sunday at 04:00 UTC

  workflow_dispatch:

jobs:
  build-lyrical:
    uses: ./.github/workflows/vxworks-ros2-build.yaml
    with:
      ros_distro: lyrical
      vxworks: "26.03"
      sdk: qemu
      test: true
      debug: false
