name: "Lyrical 26.03 Raspberry Pi 4B Build"

on:
  schedule:
    - cron: '0 5 * * 0'  # every Sunday at 05:00 UTC

  workflow_dispatch:

jobs:
  build-lyrical-rpi4b:
    uses: ./.github/workflows/vxworks-ros2-build.yaml
    with:
      ros_distro: lyrical
      vxworks: "26.03"
      sdk: raspberrypi4b
      test: false
      debug: false
